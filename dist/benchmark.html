<!doctype html><html lang="en"><meta charset="utf-8"><title>K’NEX performance benchmark</title><style>body{background:#202934;color:#eee;font:14px system-ui;margin:24px}canvas{max-width:100%}pre{white-space:pre-wrap}</style><h1>Performance benchmark</h1><p>Isolated synthetic grids. No saved models are read or changed. Render measurements include GPU completion; they are device-specific and exclude editor UI.</p><button id="run">Run benchmark</button><pre id="results"></pre><script type="module">
import * as T from './vendor/three.module.js';import {buildFrame} from './frame-builder.js';import {makeRenderPart as makePart} from './render-part.js';import {crossesSelection} from './box-selection.js';import {createPhysics} from './unified-physics.js';
const out=document.querySelector('#results'),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(800,500);document.body.append(renderer.domElement);const camera=new T.PerspectiveCamera(45,1.6,1,10000),scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x444444,2));const round=n=>Math.round(n*10)/10,median=a=>a.sort((a,b)=>a-b)[Math.floor(a.length/2)];
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;out.textContent='Measuring…\n';for(const side of[4,10,20,24]){const m=buildFrame({kind:'grid',counts:[side,side,1],rod:'r-blue',plane:'xz'}).model;for(const p of m.parts)p.grounded=true;const root=new T.Group();let start=performance.now();for(const p of m.parts){const o=makePart(p.type,p);o.position.fromArray(p.pos);o.quaternion.fromArray(p.quat);root.add(o);}const setup=performance.now()-start;scene.add(root);const box=new T.Box3().setFromObject(root),center=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3()).length();camera.position.copy(center).add(new T.Vector3(size*.7,size*.7,size*.7));camera.lookAt(center);camera.updateMatrixWorld();const times=[];let calls;for(let i=0;i<12;i++){await new Promise(requestAnimationFrame);start=performance.now();renderer.render(scene,camera);renderer.getContext().finish();if(i>1)times.push(performance.now()-start);calls=renderer.info.render.calls;}start=performance.now();const selected=root.children.filter(o=>crossesSelection(o,camera,{minX:100,maxX:700,minY:100,maxY:400},{width:800,height:500})).length,selection=performance.now()-start;let physics;start=performance.now();try{const s=createPhysics(m);physics={setupMs:round(performance.now()-start),shapes:s.shapeCount};start=performance.now();for(let i=0;i<60;i++)s.step(1/60);physics.oneSecondMs=round(performance.now()-start)}catch(e){physics={guard:e.message}}out.textContent+=JSON.stringify({parts:m.parts.length,meshSetupMs:round(setup),renderMedianMs:round(median(times)),drawCalls:calls,selectionMs:round(selection),selected,physics},null,2)+'\n';scene.remove(root);}out.textContent+='Complete. Part limit remains 2,500.';document.querySelector('#run').disabled=false;};
</script></html>
